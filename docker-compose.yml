# =============================================================================
# Local / self-hosted Docker run of ChoresRewards (app + Postgres).
#
#   cp .env.example .env         # optional: TZ, CR_SECRET_KEY, ...
#   docker compose up -d --build
#   open http://localhost:8099
#
# Production deployments are handled by Coolify, which builds the same
# ./Dockerfile, mounts a volume at /data and connects to a Postgres resource
# (see README → "Deploy with Coolify").
# =============================================================================
services:
  choresrewards:
    build:
      context: .
      dockerfile: Dockerfile
    image: choresrewards:local
    container_name: choresrewards
    ports:
      - "8099:8099"
    volumes:
      # Uploads, session secret and pre-restore backups live here
      - choresrewards-data:/data
    # Values are read from ./.env (see .env.example) with these fallbacks
    environment:
      PORT: 8099
      DATA_DIR: /data
      TZ: ${TZ:-Australia/Brisbane}
      CR_SECRET_KEY: ${CR_SECRET_KEY:-}
      ENABLE_GOOGLE_CALENDAR: ${ENABLE_GOOGLE_CALENDAR:-true}
      APP_VERSION: ${APP_VERSION:-}
      DB_BOOT_TIMEOUT_MS: ${DB_BOOT_TIMEOUT_MS:-45000}
      DATABASE_URL: ${DATABASE_URL:-postgres://choresrewards:choresrewards@db:5432/choresrewards}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    # Finish in-flight requests (the server drains on SIGTERM) before being killed
    stop_grace_period: 20s
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8099/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      # Must stay above DB_BOOT_TIMEOUT_MS so a slow-but-healthy boot is not
      # flagged unhealthy — see the note on HEALTHCHECK in the Dockerfile.
      start_period: 60s
      retries: 4

  db:
    image: postgres:16-alpine
    container_name: choresrewards-db
    environment:
      POSTGRES_USER: choresrewards
      POSTGRES_PASSWORD: choresrewards
      POSTGRES_DB: choresrewards
    volumes:
      - choresrewards-db:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U choresrewards -d choresrewards"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  choresrewards-data:
  choresrewards-db:
