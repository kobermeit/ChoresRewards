name: Build & Push HAOS Add-on Image

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract version from choresrewards/config.yaml
        id: meta
        run: |
          VERSION=$(grep -E '^version:' choresrewards/config.yaml | sed -E 's/version:[[:space:]]*"?([^"]+)"?/\1/' | tr -d '[:space:]')
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Detected Add-on Version: ${VERSION}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image to GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/kobermeit/choresrewards:${{ steps.meta.outputs.version }}
            ghcr.io/kobermeit/choresrewards:latest
          labels: |
            org.opencontainers.image.title=ChoresRewards
            org.opencontainers.image.description=Family Chores, Rewards & Household Hub
            org.opencontainers.image.source=https://github.com/kobermeit/ChoresRewards
            io.hass.version=${{ steps.meta.outputs.version }}
            io.hass.type=addon
            io.hass.arch=amd64|aarch64
          cache-from: type=gha
          cache-to: type=gha,mode=max
